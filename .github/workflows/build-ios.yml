name: Build iOS App

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iPhone Simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project EricScheduleiOS.xcodeproj \
            -scheme EricScheduleiOS \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package validated Xcode project
        working-directory: ios
        run: |
          mkdir -p dist
          cp -R EricScheduleiOS.xcodeproj EricScheduleiOS README.md project.yml dist/
          ditto -c -k --sequesterRsrc dist EricScheduleiOS-v1.0-Xcode.zip

      - name: Upload validated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: EricScheduleiOS-v1.0-Xcode
          path: ios/EricScheduleiOS-v1.0-Xcode.zip
          if-no-files-found: error
