name: EricScheduleiOS
options:
  bundleIdPrefix: com.eric.schedule
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  EricScheduleiOS:
    type: application
    platform: iOS
    sources:
      - EricScheduleiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eric.schedule.ios
        INFOPLIST_FILE: EricScheduleiOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  EricScheduleiOS:
    build:
      targets:
        EricScheduleiOS: all
    run:
      config: Debug
